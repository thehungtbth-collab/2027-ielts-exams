<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống bài tập</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 900px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 40px; }
        .practice-day { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #4361ee; }
        .day-title { color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 22px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .btn-test { display: flex; align-items: center; justify-content: center; padding: 15px; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; transition: 0.2s; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .btn-reading { background-color: #e74c3c; }
        .btn-reading:hover { background-color: #c0392b; transform: translateY(-2px); }
        .btn-listening { background-color: #2ecc71; }
        .btn-listening:hover { background-color: #27ae60; transform: translateY(-2px); }
        .btn-writing { background-color: #f39c12; }
        .btn-writing:hover { background-color: #d68910; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Danh Sách Bài Tập</h1>
        
            <div class="practice-day">
                <h2 class="day-title">NGÀY 07 THÁNG 11 NĂM 2026</h2>
                <div class="grid">
                    <a href="READING PRACTICE PART 1.html" class="btn-test btn-reading" target="_blank">Reading Practice</a>
                    <a href="LISTENING PRACTICE PART 1.html" class="btn-test btn-listening" target="_blank">Listening Practice</a>
                    
                </div>
            </div>
    </div>
</body>
</html>
