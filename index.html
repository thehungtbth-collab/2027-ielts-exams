  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent1:#6a11cb;--accent2:#2575fc;--muted:#6b7280;--btn-text:#fff}
    html, body { height: 100%; margin: 0; }
    body{font-family:Inter,system-ui,Arial;background:var(--bg);color:#111}
    .wrap{
      max-width:100%;
      width:100%;
      height:100vh;
      margin:0;
      padding:18px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:12px;
      background:linear-gradient(180deg,rgba(255,255,255,0.7),#fff);

    h2{margin:0 0 6px 0}
    .controls{flex:0 0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}

    .btn-primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 8px 24px rgba(37,117,252,0.12)}
    .btn-ghost{background:transparent;color:var(--accent2);border:1px solid rgba(37,117,252,0.12);color:var(--accent2);border-radius:10px;padding:8px 12px}
    .btn:hover{transform:translateY(-2px)}
    /* iframe chiếm phần còn lại */
    #frame{flex:1 1 auto;width:100%;min-height:0;border-radius:10px;border:1px solid #e6eef8;background:#fff}
    .meta{color:var(--muted);font-size:13px;margin-top:6px}
    /* fullscreen styles */
    .fullscreen-frame {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9998 !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .hidden { display: none !important; }
    #closeFullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      background: rgba(255,255,255,0.95);
      color: #111;
      font-weight:700;
      box-shadow: 0 6px 18px rgba(16,24,40,0.12);
      cursor: pointer;
    }
    @media (max-width:640px){ .controls{flex-direction:column;align-items:stretch} select{width:100%} }
  </style>

    const items = [{"name":"GIỮA KỲ II (3).html","filename":"GIỮA KỲ II (3).html","content":"<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>English Practice</title><style>\n        :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626; --bg: #f8fafc; --highlight: #fef08a; } body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.8; } #main { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } .section-box { margin-bottom: 50px; } .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary); margin: 0 0 15px 0; } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; } .gap-fill-text { font-size: 1.15em; text-align: justify; line-height: 1.8; } \n        .gap-btn { display: inline; background: transparent; border: none; border-bottom: 1px dotted #94a3b8; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 2px; margin: 0 2px; font-size: inherit; font-family: inherit; transition: all 0.2s; } .gap-btn:hover { color: #1d4ed8; border-bottom-style: solid; } .gap-btn.filled { border-bottom: none; font-weight: bold; } .gap-btn.correct { color: var(--success) !important; } .gap-btn.wrong { color: var(--error) !important; text-decoration: line-through; }\n        .reading-container { display: flex; height: 650px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background:#fff; } .reading-left { flex: 1; padding: 25px; overflow-y: auto; background: #fff; border-right: 4px solid #f1f5f9; resize: horizontal; overflow-x: hidden; max-width: 70%; min-width: 30%; } .reading-right { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; } .reading-left::-webkit-scrollbar, .reading-right::-webkit-scrollbar { width: 8px; } .reading-left::-webkit-scrollbar-track, .reading-right::-webkit-scrollbar-track { background: #f1f1f1; } .reading-left::-webkit-scrollbar-thumb, .reading-right::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } \n        .vocab-highlight { background-color: transparent; border-bottom: 2px dashed #f59e0b; cursor: help; padding: 0 1px; color: inherit; font-weight: 500; transition: all 0.2s; } .vocab-highlight:hover { background-color: #fffbeb; color: #d97706; }\n        .mcq-question { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; } .sortable-list { list-style: none; padding: 0; } .sortable-item { background: #fff; border: 1px solid #cbd5e1; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 15px; } .popover { position: absolute; background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 10px; z-index: 1000; display: none; min-width: 250px; max-width: 400px; } .popover-option { display: block; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; } .popover-option:hover { background-color: #f8fafc; color: var(--primary); } .vocab-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 400px; border-radius: 16px; z-index: 10000; display: none; border: 1px solid #e2e8f0; overflow:hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); } .vocab-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; } .vocab-body { padding: 20px; } .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999; display: none; } button.action-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); } \n        .mcq-options label { display: block; margin: ay: none; overflow-y: auto; color: #e6eef6; }\n        #game-container { width:100%; max-width:1200px; margin: 0 auto; padding: 24px; }\n        .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }\n        .game-h1 { font-size:20px; margin:0; color:#06b6d4; }\n        .game-controls { display:flex; gap:8px; align-items:center; }\n        .game-btn { background:linear-gradient(90deg,#0ea5a4,#06b6d4); border:0; color:#042027; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }\n        .game-btn-close { background: #ef4444; color: white; }\n        .game-layout { display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }\n        .game-card { flex: 0 0 48%; min-width:320px; box-sizing:border-box; padding:12px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.03); max-height: calc(100vh - 180px); overflow:auto; }\n        .game-list { display:flex; flex-direction:column; gap:10px; }\n        .game-eng-item, .game-vie-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color: #e6eef6; }\n        .game-eng-left { display:flex; align-items:center; gap:12px; flex: 0 0 220px; min-width:160px; }\n        .game-index { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; color:#94a3b8; font-weight:700; }\n        .game-slot { flex:1; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.01); border:2px dashed rgba(255,255,255,0.03); min-height:56px; transition:all 220ms ease; cursor:pointer; position:relative; overflow:visible; }\n        .game-slot .inner { position:relative; z-index:3; }\n        .game-slot.correct { padding-left:12px; font-size:15px; display:flex; align-items:center; border-style:solid; border-width:2px; background:linear-gradient(180deg, rgba(16,185,129,0.03), rgba(16,185,129,0.01)); }\n        .game-slot.correct::before { background: linear-gradient(90deg, rgba(16,185,129,0.9), rgba(96,165,250,0.06)); opacity:0.6; filter:blur(10px); }\n        .game-vie-list { display:flex; flex-wrap:wrap; gap:10px; padding-top:6px; }\n        .game-vie-item { cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); }\n        .game-vie-item.dragging { opacity:0.5; transform:scale(0.98); }\n        .game-wrong { animation:shake 300ms; border-color:rgba(239,68,68,0.6); }\n        .game-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:#94a3b8; font-weight:600; }\n        .game-confetti { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:6000; }\n        .game-confetti .piece { position:absolute; width:10px; height:14px; opacity:0; animation:fall 1200ms linear forwards; }\n        .game-small { font-size:13px; color:#94a3b8; }\n        .flash-wrap { perspective:1200px; width:100%; max-width:520px; }\n        .flashcard { width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer; }\n        .flashcard.flipped { transform:rotateY(180deg); }\n        .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }\n        .flash-face.front { background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb; }\n        .flash-face.back { transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0; }\n        .fill-list { display:flex; flex-direction:column; gap:10px; }\n        .fill-row { display:flex; gap:12px; align-items:center; }\n        .fill-row .vie { flex:0 0 48%; min-width:160px; color:#94a3b8; }\n        .fill-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:rgba(230,238,246,0.85); transition:all 180ms; }\n        .fill-row input.correct { border-color: rgba(16,185,129,0.7); background: rgba(16,185,129,0.02); }\n        .fill-row input.wrong { border-color: rgba(244,63,94,0.7); background: rgba(244,63,94,0.01); }\n        @keyframes shake{ 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }\n        @keyframes fall{ 0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)} }\n        @media (max-width:880px){ .game-layout{grid-template-columns:1fr; flex-direction: column;} .game-card{flex-basis:100%; width:100%;} }\n        \n        </style></head>\n        <body>\n        <div id=\"main\">\n            <button class=\"btn-game\" onclick=\"openVocabGame()\">🎮 Play Vocab Game</button>\n            <h1>English Practice Test</h1>\n            <div class=\"section-box\"><h3 class=\"section-title\">Part 1: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\"><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>5.</b> People think that the global warming<span class=\"gap-btn\" id=\"gap-1-5\" onclick=\"showGapOptions(event, '1', '5')\">(...)</span> lots of problems in the future.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>6.</b> She is a <span class=\"gap-btn\" id=\"gap-1-6\" onclick=\"showGapOptions(event, '1', '6')\">(...)</span>, and she buys new clothes and shoes every week.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>7.</b> Every year, more than ten<span class=\"gap-btn\" id=\"gap-1-7\" onclick=\"showGapOptions(event, '1', '7')\">(...)</span> with strong winds and rain cause damage in our country.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>8.</b> <span class=\"gap-btn\" id=\"gap-1-8\" onclick=\"showGapOptions(event, '1', '8')\">(...)</span> by the 3 Rs? – They are Reduce, Reuse, and Recycle.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>9.</b> We are donating money and food to help the <span class=\"gap-btn\" id=\"gap-1-9\" onclick=\"showGapOptions(event, '1', '9')\">(...)</span>of the landslide.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>10.</b> <span class=\"gap-btn\" id=\"gap-1-10\" onclick=\"showGapOptions(event, '1', '10')\">(...)</span> Nam left the party, he said goodbye to the host.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>11.</b> She won’t go to school <span class=\"gap-btn\" id=\"gap-1-11\" onclick=\"showGapOptions(event, '1', '11')\">(...)</span> she feels better tomorrow.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>12.</b> Some people may get addicted <span class=\"gap-btn\" id=\"gap-1-12\" onclick=\"showGapOptions(event, '1', '12')\">(...)</span> online shopping. They cannot stop buying things, even things they don’t really need.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>13.</b> We can’t prevent natural disasters, but we can <span class=\"gap-btn\" id=\"gap-1-13\" onclick=\"showGapOptions(event, '1', '13')\">(...)</span> some of them.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>14.</b> My grandmother taught me how to <span class=\"gap-btn\" id=\"gap-1-14\" onclick=\"showGapOptions(event, '1', '14')\">(...)</span> crafts from bamboo.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>15.</b> The bus schedule says that there <span class=\"gap-btn\" id=\"gap-1-15\" onclick=\"showGapOptions(event, '1', '15')\">(...)</span>a bus to Aone at 10 o’clock.</div></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 2: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">One of the most important reasons of global warming is air  <span class=\"gap-btn\" id=\"gap-2-19\" onclick=\"showGapOptions(event, '2', '19')\">(19)</span>  .More and more factories are being built in different countries. By burning oil, coal, gasoline, even natural gas, they add more carbon dioxide to the  <span class=\"gap-btn\" id=\"gap-2-20\" onclick=\"showGapOptions(event, '2', '20')\">(20)</span>  .Cars also influence the atmosphere badly  <span class=\"gap-btn\" id=\"gap-2-21\" onclick=\"showGapOptions(event, '2', '21')\">(21)</span>  burning many liters of oil and releasing harmful gases into the air. As a result, the ozone layer of our Earth is being destroyed.<br>All these activities unfavorably change  <span class=\"gap-btn\" id=\"gap-2-22\" onclick=\"showGapOptions(event, '2', '22')\">(22)</span>  Earth’s heat balance. This is what we get in return: the ground becomes very dry, a lot of rivers and lakes dry up, the forests start burning, the glaciers melt, people and animals start to faint. And these are not all the outcomes of global  <span class=\"gap-btn\" id=\"gap-2-23\" onclick=\"showGapOptions(event, '2', '23')\">(23)</span>  . Nature becomes really angry with us. We need to be more attentive and caring to it if we want to save our planet.<br></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 3: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-3\"><div class=\"reading-left\">Sarah loves shopping online. She prefers \" onchange=\\\"checkMCQ('3', '24', 'C')\\\"> C. In a store.</label><label><input type=\\\"radio\\\" name=\\\"q24\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '24', 'D')\\\"> D. In the supermarket.</label></div><div id=\\\"res-3-24\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 25.</b> What does she NOT like buying online?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '25', 'A')\\\"> A. furniture</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '25', 'B')\\\"> B. food</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '25', 'C')\\\"> C. clothes</label><label><input type=\\\"radio\\\" name=\\\"q25\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '25', 'D')\\\"> D. books</label></div><div id=\\\"res-3-25\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 26.</b> The word “likes” in the first paragraph is opposite in meaning to _________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '26', 'A')\\\"> A. hates</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '26', 'B')\\\"> B. loves</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '26', 'C')\\\"> C. adore</label><label><input type=\\\"radio\\\" name=\\\"q26\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '26', 'D')\\\"> D. dislike</label></div><div id=\\\"res-3-26\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 27.</b> What does the word ‘‘it’’ in the second paragraph refer to?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '27', 'A')\\\"> A. everything</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '27', 'B')\\\"> B. something</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '27', 'C')\\\"> C. nothing</label><label><input type=\\\"radio\\\" name=\\\"q27\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '27', 'D')\\\"> D. anything</label></div><div id=\\\"res-3-27\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 28.</b> Sharah thinks that shopping online is_____________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '28', 'A')\\\"> A. often dangerous</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '28', 'B')\\\"> B. is not interesting</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '28', 'C')\\\"> C. is safe if you are careful</label><label><input type=\\\"radio\\\" name=\\\"q28\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '28', 'D')\\\"> D. is always safe</label></div><div id=\\\"res-3-28\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 29.</b> The word “secure” in the third paragraph is closest in meaning to________?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '29', 'A')\\\"> A. safe</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '29', 'B')\\\"> B. dangerous</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '29', 'C')\\\"> C. serious</label><label><input type=\\\"radio\\\" name=\\\"q29\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '29', 'D')\\\"> D. common</label></div><div id=\\\"res-3-29\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 30.</b> Sharah thinks that in the future____________.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '30', 'A')\\\"> A. no one will shop online</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '30', 'B')\\\"> B. everybody will only shop online</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '30', 'C')\\\"> C. some people will shop online</label><label><input type=\\\"radio\\\" name=\\\"q30\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '30', 'D')\\\"> D. online shopping will be safer</label></div><div id=\\\"res-3-30\\\" style=\\\"margin-top:5px\\\"></div></div></div></div></div>\"}; const allKeys = DATA.keys; \n\n        // --- CÁC HÀM XỬ LÝ (ĐÃ UPDATE LOGIC KEY BIỆT LẬP) ---\n        function showGapOptions(e, secId, id) { \n            const p = document.getElementById('gap-popover'); \n            const uniqueKey = secId + '-' + id; \n            const o = DATA.gapOptions[uniqueKey]; \n            if(!o) return;\n            let h = \"\"; \n            for(let k in o) h += '<span class=\"popover-option\" onclick=\"selectGap(\\''+secId+'\\', \\''+id+'\\', \\''+k+'\\', \\''+o[k].replace(/'/g, \"\\\\'\")+'\\')\"><b>'+k+'.</b> '+o[k]+'</span>'; \n            p.innerHTML = h; p.style.display = 'block'; p.style.left = e.pageX + 'px'; p.style.top = (e.pageY + 20) + 'px'; \n            setTimeout(() => { document.addEventListener('click', function close(ev) { if (!p.contains(ev.target) && ev.target !== e.target) { p.style.display = 'none'; document.removeEventListener('click', close); } }); }, 0); \n        } \n\n        function selectGap(secId, qId, key, text) { \n            const btn = document.getElementById('gap-'+secId+'-'+qId); \n            if(!btn) return;\n            btn.innerText = text; btn.classList.add('filled'); \n            document.getElementById('gap-popover').style.display = 'none'; \n            \n            // CHECK KEY: Dùng secId-qId để tìm key trong kho\n            const fullKey = secId + '-' + qId;\n            if(allKeys[fullKey]) { \n                btn.style.borderColor = (key === allKeys[fullKey]) ? \"#22c55e\" : \"#ef4444\"; \n                btn.classList.remove('correct', 'wrong'); \n                if(key === allKeys[fullKey]) btn.classList.add('correct'); else btn.classList.add('wrong'); \n            } \n        } \n\n        function checkWordForm() { \n            const inputs = document.querySelectorAll('.word-form-input'); \n            inputs.forEach(inp => { \n                // ID input: wf-secId-qNum\n                const parts = inp.id.split('-');\n                const fullKey = parts[1] + '-' + parts[2];\n                \n                const userVal = inp.value.trim().toLowerCase(); \n                const correctKey = allKeys[fullKey] ? String(allKeys[fullKey]).trim().toLowerCase() : \"\"; \n                inp.classList.remove('correct', 'wrong'); \n                const parent = inp.parentNode; \n                const oldCorr = parent.querySelector('.correction-text'); \n                if(oldCorr) oldCorr.remove(); \n                if (!correctKey) return; \n                if (userVal === correctKey) { inp.classList.add('correct'); } \n                else { inp.classList.add('wrong'); const span = document.createElement('span'); span.className = 'correction-text'; span.innerHTML = '✓ ' + allKeys[fullKey]; if(inp.nextSibling) { parent.insertBefore(span, inp.nextSibling); } else { parent.appendChild(span); } } \n            }); \n        }\n\n        // HÀM CHECK MCQ MỚI (CHO BÀI READING)\n        function checkMCQ(secId, qId, selected) { \n            const resDiv = document.getElementById('res-'+secId+'-'+qId);\n            const fullKey = secId + '-' + qId;\n            resDiv.innerHTML = (allKeys[fullKey] && selected === allKeys[fullKey]) ? '<span style=\"color:#22c55e\">✓ Correct</span>' : '<span style=\"color:#ef4444\">✗ Incorrect</span>'; \n        }\n\n        // (GIỮ NGUYÊN CÁC HÀM KHÁC)\n        let dragSrcEl = null; function addDragEvents() { document.querySelectorAll('.sortable-item').forEach(item => { item.addEventListener('dragstart', function(e) { dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }); item.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); return false; }); item.addEventListener('drop', function(e) { if (e.stopPropagation) e.stopPropagation(); if (dragSrcEl !== this) { const srcHTML = dragSrcEl.innerHTML; const srcId = dragSrcEl.dataset.sid; dragSrcEl.innerHTML = this.innerHTML; dragSrcEl.dataset.sid = this.dataset.sid; this.innerHTML = srcHTML; this.dataset.sid = srcId; } return false; }); }); } window.onload = function() { addDragEvents(); }; \n        function checkOrder(qId, targetStr) { const list = document.getElementById('sortable-'+qId); const current = Array.from(list.getElementsByTagName('li')).map(li => li.dataset.sid); const ans = document.getElementById('ans-'+qId); const fb = document.getElementById('fb-'+qId); if(JSON.stringify(current) === JSON.stringify(targetStr.split(','))) { fb.innerHTML = '<span style=\"color:#22c55e\">✓ Correct!</span>'; ans.style.display = 'none'; } else { fb.innerHTML = '<span style=\"color:#ef4444\">✗ Incorrect</span>'; ans.style.display = 'block'; } } \n        function showVocabDef(key) { const d = DATA.vocabMap[key.toLowerCase()]; if(!d) return; document.getElementById('v-word').innerText = d.original; document.getElementById('v-meaning').innerText = d.meaning; document.getElementById('v-synonym').innerText = d.synonyms ? 'Synonyms: ' + d.synonyms : ''; document.getElementById('v-example').innerText = d.example ? 'Ex: ' + d.example : ''; document.getElementById('vocab-modal').style.display = 'block'; document.querySelector('.overlay').style.display = 'block'; } \n        function closeVocabModal() { document.getElementById('vocab-modal').style.display = 'none'; document.querySelector('.overlay').style.display = 'none'; }\n        function toggleFullScreenReading(btn) { const r = btn.closest('.section-box'); r.classList.toggle('fullscreen-reading'); btn.innerText = r.classList.contains('fullscreen-reading') ? '🗗 Exit Full Screen' : '⛶ Full Screen'; }\n\n        // GAME LOGIC\n        let pairs=[], gameState={engOrder:[],shuffledVie:[],matches:{},score:0};\n        const engListEl=document.getElementById('engList'), vieListEl=document.getElementById('vieList'), scoreEl=document.getElementById('score'), confettiEl=document.getElementById('confetti');\n        function loadPairsFromMap(){ pairs = []; for(let k in DATA.vocabMap){ pairs.push({eng: DATA.vocabMap[k].original, vie: DATA.vocabMap[k].meaning}); } }\n        window.openVocabGame = function() { loadPairsFromMap(); if(pairs.length===0){ alert(\"Không có từ vựng nào!\"); return; } document.getElementById('vocab-game-overlay').style.display='block'; initGame(); }\n        window.closeVocabGame = function() { document.getElementById('vocab-game-overlay').style.display='none'; }\n        function shuffleArray(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }\n        function initGame(){ gameState.matches={}; gameState.score=0; gameState.engOrder=shuffleArray(pairs.map((_,i)=>i)); gameState.shuffledVie=shuffleArray(pairs.map(p=>p.vie)); renderGameEng(); renderGameVie(); attachGameSlotEvents(); updateGameScore(); initFlashcards(); renderFillList(); }\n        function renderGameEng(){ engListEl.innerHTML=''; gameState.engOrder.forEach((o,p)=>{ const x=pairs[o]; const i=document.createElement('div'); i.className='game-eng-item'; i.innerHTML='<div class=\"game-eng-left\"><div class=\"game-index\">'+(p+1)+'</div><div><div style=\"font-weight:700\">'+x.eng+'</div></div></div><div class=\"game-slot\" data-index=\"'+o+'\" tabindex=\"0\"><div class=\"inner\"></div></div>'; engListEl.appendChild(i); }); }\n        function renderGameVie(){ vieListEl.innerHTML=''; gameState.shuffledVie.forEach((t,i)=>{ const d=document.createElement('div'); d.className='game-vie-item'; d.draggable=true; d.dataset.text=t; d.innerHTML='<span style=\"font-weight:600\">'+t+'</span>'; vieListEl.appendChild(d); d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.setData('text/plain',t);window.currentPicked={text:t,el:d}}); d.addEventListener('dragend',()=>d.classList.remove('dragging')); d.addEventListener('click',()=>{if(window.currentPicked&&window.currentPicked.el===d){window.currentPicked=null;d.style.outline=''}else{if(window.currentPicked)window.currentPicked.el.style.outline='';window.currentPicked={text:t,el:d};d.style.outline='2px solid rgba(6,182,212,0.8)'}}); }); }\n        function attachGameSlotEvents(){ document.querySelectorAll('.game-slot').forEach(s=>{ s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('active')}); s.addEventListener('dragleave',()=>s.classList.remove('active')); s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('active');const t=e.dataTransfer.getData('text/plain');handleGameDrop(s,t)}); s.addEventListener('click',()=>{if(window.currentPicked)handleGameDrop(s,window.currentPicked.text)}); }); }\n        function handleGameDrop(s,t){ const i=Number(s.dataset.index); const c=pairs[i].vie; if(gameState.matches[i])return; if(t===c){ s.classList.add('correct'); s.innerHTML='<div class=\"inner\"><span style=\"font-weight:700;color:var(--success)\">'+t+'</span></div>'; gameState.matches[i]=t; gameState.score++; updateGameScore(); celebrate(); speak(pairs[i].eng); const el=Array.from(document.querySelectorAll('.game-vie-item')).find(x=>x.dataset.text===t); if(el)el.remove(); window.currentPicked=null; }else{ s.classList.add('game-wrong'); setTimeout(()=>s.classList.remove('game-wrong'),400); } }\n        function updateGameScore(){ scoreEl.innerHTML='Đúng: <strong>'+gameState.score+'</strong> / '+pairs.length; }\n        function celebrate(){ const c=['#06b6d4','#f97316','#f43f5e','#10b981']; for(let i=0;i<15;i++){ const p=document.createElement('div'); p.className='piece'; p.style.left=Math.random()*100+'%'; p.style.background=c[Math.floor(Math.random()*c.length)]; confettiEl.appendChild(p); setTimeout(()=>p.remove(),1500); } }\n        function speak(t){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.speak(u); } }\n        let flashIndex=0;\n        function initFlashcards(){ flashIndex=0; renderFlash(); }\n        function renderFlash(){ if(!pairs.length)return; const p=pairs[flashIndex]; document.getElementById('flashFront').textContent=p.eng; document.getElementById('flashBack').textContent=p.vie; document.getElementById('flashcard').classList.remove('flipped'); }\n        document.getElementById('nextCard').addEventListener('click',()=>{flashIndex=(flashIndex+1)%pairs.length;renderFlash()}); document.getElementById('prevCard').addEventListener('click',()=>{flashIndex=(flashIndex-1+pairs.length)%pairs.length;renderFlash()}); document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flashcard').classList.toggle('flipped'));\n        const fillListEl=document.getElementById('fillList'), fillScoreEl=document.getElementById('fillScore');\n        function renderFillList(){ fillListEl.innerHTML=''; pairs.forEach((p,i)=>{ const r=document.createElement('div'); r.className='fill-row'; r.innerHTML='<div class=\"vie\">'+p.vie+'</div><input type=\"text\" data-index=\"'+i+'\" placeholder=\"...\" /><div class=\"game-small\" style=\"min-width:60px\" id=\"hint-'+i+'\"></div>'; fillListEl.appendChild(r); }); fillScoreEl.textContent='Điểm: 0 / '+pairs.length; }\n        document.getElementById('checkFill').addEventListener('click',()=>{ let c=0; pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); if(inp.value.trim().toLowerCase()===p.eng.toLowerCase()){c++;inp.classList.add('correct');}else{inp.classList.add('wrong');} }); fillScoreEl.textContent='Điểm: '+c+' / '+pairs.length; });\n        document.getElementById('showAnswers').addEventListener('click',()=>{ pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); inp.value=p.eng; inp.classList.add('correct'); }); });\n        document.getElementById('resetFill').addEventListener('click', renderFillList);\n        document.getElementById('shuffleBtn').addEventListener('click',()=>{gameState.matches={};gameState.score=0;gameState.engOrder=shuffleArray(gameState.engOrder);gameState.shuffledVie=shuffleArray(gameState.shuffledVie);renderGameEng();renderGameVie();attachGameSlotEvents();updateGameScore()});\n        document.getElementById('resetBtn').addEventListener('click',initGame);\n        <\/script>\n\t\t\n\t\t<script type=\"text/javascript\">var lbplugin_event_opt={\"extension_enable\":true,\"dict_type\":1,\"dbclk_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1},\"select_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1}};function loadScript(t,e){var n=document.createElement(\"script\");n.type=\"text/javascript\",n.readyState?n.onreadystatechange=function(){(\"loaded\"===n.readyState||\"complete\"===n.readyState)&&(n.onreadystatechange=null,e())}:n.onload=function(){e()},n.src=t,document.getElementsByTagName(\"head\")[0].appendChild(n)}setTimeout(function(){null==document.getElementById(\"lbdictex_find_popup\")&&loadScript(\"https://stc-laban.zdn.vn/dictionary/js/plugin/lbdictplugin.min.js?\"+Date.now()%1e4,function(){lbDictPlugin.init(lbplugin_event_opt)})},1e3);<\/script>\n\t\t\n\t\t</body></html>"},{"name":"GIỮA KỲ II (2).html","filename":"GIỮA KỲ II (2).html","content":"<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>English Practice</title><style>\n        :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626; --bg: #f8fafc; --highlight: #fef08a; } body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.8; } #main { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } .section-box { margin-bottom: 50px; } .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary); margin: 0 0 15px 0; } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; } .gap-fill-text { font-size: 1.15em; text-align: justify; line-height: 1.8; } \n        .gap-btn { display: inline; background: transparent; border: none; border-bottom: 1px dotted #94a3b8; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 2px; margin: 0 2px; font-size: inherit; font-family: inherit; transition: all 0.2s; } .gap-btn:hover { color: #1d4ed8; border-bottom-style: solid; } .gap-btn.filled { border-bottom: none; font-weight: bold; } .gap-btn.correct { color: var(--success) !important; } .gap-btn.wrong { color: var(--error) !important; text-decoration: line-through; }\n        .reading-container { display: flex; height: 650px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background:#fff; } .reading-left { flex: 1; padding: 25px; overflow-y: auto; background: #fff; border-right: 4px solid #f1f5f9; resize: horizontal; overflow-x: hidden; max-width: 70%; min-width: 30%; } .reading-right { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; } .reading-left::-webkit-scrollbar, .reading-right::-webkit-scrollbar { width: 8px; } .reading-left::-webkit-scrollbar-track, .reading-right::-webkit-scrollbar-track { background: #f1f1f1; } .reading-left::-webkit-scrollbar-thumb, .reading-right::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } \n        .vocab-highlight { background-color: transparent; border-bottom: 2px dashed #f59e0b; cursor: help; padding: 0 1px; color: inherit; font-weight: 500; transition: all 0.2s; } .vocab-highlight:hover { background-color: #fffbeb; color: #d97706; }\n        .mcq-question { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; } .sortable-list { list-style: none; padding: 0; } .sortable-item { background: #fff; border: 1px solid #cbd5e1; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 15px; } .popover { position: absolute; background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 10px; z-index: 1000; display: none; min-width: 250px; max-width: 400px; } .popover-option { display: block; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; } .popover-option:hover { background-color: #f8fafc; color: var(--primary); } .vocab-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 400px; border-radius: 16px; z-index: 10000; display: none; border: 1px solid #e2e8f0; overflow:hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); } .vocab-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; } .vocab-body { padding: 20px; } .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999; display: none; } button.action-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); } \n        .mcq-options label { display: block; margin: 8px 0; cursor: pointer; padding:8px; border-radius:4px; transition:background 0.2s } .mcq-options label:hover { background-color: #f1f5f9; }\n        .fullscreen-reading { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; } .fullscreen-reading .reading-container { flex: 1; height: auto !important; } .fullscreen-btn { float: right; padding: 5px 10px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; margin-bottom:5px; } .fullscreen-btn:hover { background: #334155; }\n        .btn-game { background: linear-gradient(90deg, #8b5cf6, #d946ef); color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-bottom:20px; }\n        .word-form-input { border: none; border-bottom: 2px solid #94a3b8; background: transparent; padding: 2px 5px; font-size: 1em; color: var(--primary); font-weight: bold; width: 150px; outline: none; transition: 0.3s; text-align: center; } .word-form-input:focus { border-bottom-color: var(--primary); background: #eff6ff; } .word-form-input.correct { border-bottom-color: var(--success); color: var(--success); background: #dcfce7; } .word-form-input.wrong { border-bottom-color: var(--error); color: var(--error); background: #fee2e2; text-decoration: line-through; } .correction-text { display: inline-block; margin-left: 8px; color: var(--success); font-weight: bold; font-size: 0.9em; background: #f0fdf4; padding: 2px 6px; border-radius: 4px; border: 1px solid #bbf7d0; }\n        @media (max-width: 768px) { .reading-container { flex-direction: column; height: auto; } .reading-left { resize: none; max-width: 100%; border-right: none; border-bottom: 4px solid #f1f5f9; max-height: 300px; } .vocab-modal { width: 90%; } }\n        \n        #vocab-game-overlay { position: fixed; inset: 0; z-index: 5000; background: #0f1724; display: none; overflow-y: auto; color: #e6eef6; }\n        #game-container { width:100%; max-width:1200px; margin: 0 auto; padding: 24px; }\n        .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }\n        .game-h1 { font-
