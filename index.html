acity:0.6; filter:blur(10px); }\n        .game-vie-list { display:flex; flex-wrap:wrap; gap:10px; padding-top:6px; }\n        .game-vie-item { cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); }\n        .game-vie-item.dragging { opacity:0.5; transform:scale(0.98); }\n        .game-wrong { animation:shake 300ms; border-color:rgba(239,68,68,0.6); }\n        .game-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:#94a3b8; font-weight:600; }\n        .game-confetti { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:6000; }\n        .game-confetti .piece { position:absolute; width:10px; height:14px; opacity:0; animation:fall 1200ms linear forwards; }\n        .game-small { font-size:13px; color:#94a3b8; }\n        .flash-wrap { perspective:1200px; width:100%; max-width:520px; }\n        .flashcard { width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer; }\n        .flashcard.flipped { transform:rotateY(180deg); }\n        .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }\n        .flash-face.front { background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb; }\n        .flash-face.back { transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0; }\n        .fill-list { display:flex; flex-direction:column; gap:10px; }\n        .fill-row { display:flex; gap:12px; align-items:center; }\n        .fill-row .vie { flex:0 0 48%; min-width:160px; color:#94a3b8; }\n        .fill-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:rgba(230,238,246,0.85); transition:all 180ms; }\n        .fill-row input.correct { border-color: rgba(16,185,129,0.7); background: rgba(16,185,129,0.02); }\n        .fill-row input.wrong { border-color: rgba(244,63,94,0.7); background: rgba(244,63,94,0.01); }\n        @keyframes shake{ 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }\n        @keyframes fall{ 0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)} }\n        @media (max-width:880px){ .game-layout{grid-template-columns:1fr; flex-direction: column;} .game-card{flex-basis:100%; width:100%;} }\n        \n        </style></head>\n        <body>\n        <div id=\"main\">\n            <button class=\"btn-game\" onclick=\"openVocabGame()\">🎮 Play Vocab Game</button>\n            <h1>English Practice Test</h1>\n            <div class=\"section-box\"><h3 class=\"section-title\">Part 1: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\"><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>5.</b> While she <span class=\"gap-btn\" id=\"gap-1-5\" onclick=\"showGapOptions(event, '1', '5')\">(...)</span> in the field, the tornado came.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>6.</b> Look! These sports shoes are  <span class=\"gap-btn\" id=\"gap-1-6\" onclick=\"showGapOptions(event, '1', '6')\">(...)</span>sale . They are 30% off.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>7.</b> Because of  <span class=\"gap-btn\" id=\"gap-1-7\" onclick=\"showGapOptions(event, '1', '7')\">(...)</span> pollution, the bicycle may someday replace the automobile.\n     </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>8.</b> I’m searching for <span class=\"gap-btn\" id=\"gap-1-8\" onclick=\"showGapOptions(event, '1', '8')\">(...)</span> information about the lifestyle of the Van Kieu in central Viet Nam.\n   </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>9.</b> I like <span class=\"gap-btn\" id=\"gap-1-9\" onclick=\"showGapOptions(event, '1', '9')\">(...)</span> tea but I don’t like the tea they make at the office.\n   </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>10.</b> Many girls worry about their appearance, <span class=\"gap-btn\" id=\"gap-1-10\" onclick=\"showGapOptions(event, '1', '10')\">(...)</span> they often look at themselves in a mirror.\n     </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>11.</b> It is <span class=\"gap-btn\" id=\"gap-1-11\" onclick=\"showGapOptions(event, '1', '11')\">(...)</span> easier to prevent harm to the environment than to repair it.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>12.</b> <span class=\"gap-btn\" id=\"gap-1-12\" onclick=\"showGapOptions(event, '1', '12')\">(...)</span> she left the party, Jenny said goodbye to the host.\n    </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>13.</b> - An: <span class=\"gap-btn\" id=\"gap-1-13\" onclick=\"showGapOptions(event, '1', '13')\">(...)</span>by the 3Rs? \n                      - Ba: They are Reduce, Reuse, and Recycle\n </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>14.</b> <span class=\"gap-btn\" id=\"gap-1-14\" onclick=\"showGapOptions(event, '1', '14')\">(...)</span> street food in Viet Nam is most popular among foreign visitors?\n     </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>15.</b> There are different types of street food among regions and <span class=\"gap-btn\" id=\"gap-1-15\" onclick=\"showGapOptions(event, '1', '15')\">(...)</span> around the world.\n</div></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 2: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-2\"><div class=\"reading-left\">Many people still believe that natural resources will never be used up. Actually, the world's energy resources are limited. Nobody knows exactly how much fuel is left. However, we also should use them economically and try to find out alternative sources of power. According to Professor Marvin Burnham of the New England Institute of Technology, we have to start conserving coal, oil and gas before it is too late; and nuclear power is the only alternative.<br>However, many people do not approve of using nuclear power because it's very dangerous. What would happen if there were a serious nuclear accident?Radioactivity causes cancer and may badly affect the future generations. The most effective thing is that we should use natural resources as economically as possible.<br>(Adapted from sachmoi24h.com)<br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 1.</b> Many people still believe that we will never ......... natural resources.<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q1\" value=\"A\" onchange=\"checkMCQ('3', '1', 'A')\"> A. rise</label><label><input type=\"radio\" name=\"q1\" value=\"B\" onchange=\"checkMCQ('3', '1', 'B')\"> B. reduce</label><label><input type=\"radio\" name=\"q1\" value=\"C\" onchange=\"checkMCQ('3', '1', 'C')\"> C. run out of</label><label><input type=\"radio\" name=\"q1\" value=\"D\" onchange=\"checkMCQ('3', '1', 'D')\"> D. raise</label></div><div id=\"res-3-1\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 2.</b> What's the main idea of the passage?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q2\" value=\"A\" onchange=\"checkMCQ('3', '2', 'A')\"> A. save energy</label><label><input type=\"radio\" name=\"q2\" value=\"B\" onchange=\"checkMCQ('3', '2', 'B')\"> B. nuclear accident</label><label><input type=\"radio\" name=\"q2\" value=\"C\" onchange=\"checkMCQ('3', '2', 'C')\"> C. natural resource</label><label><input type=\"radio\" name=\"q2\" value=\"D\" onchange=\"checkMCQ('3', '2', 'D')\"> D. the use of coal</label></div><div id=\"res-3-2\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 3.</b> The phrase \"approve of\" in the passage is closest in meaning to<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q3\" value=\"A\" onchange=\"checkMCQ('3', '3', 'A')\"> A. explain</label><label><input type=\"radio\" name=\"q3\" value=\"B\" onchange=\"checkMCQ('3', '3', 'B')\"> B. disagree</label><label><input type=\"radio\" name=\"q3\" value=\"C\" onchange=\"checkMCQ('3', '3', 'C')\"> C. improve</label><label><input type=\"radio\" name=\"q3\" value=\"D\" onchange=\"checkMCQ('3', '3', 'D')\"> D. agree</label></div><div id=\"res-3-3\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 4.</b> What causes cancer and may badly affect the future generations?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q4\" value=\"A\" onchange=\"checkMCQ('3', '4', 'A')\"> A. Coal</label><label><input type=\"radio\" name=\"q4\" value=\"B\" onchange=\"checkMCQ('3', '4', 'B')\"> B. Radioactivity</label><label><input type=\"radio\" name=\"q4\" value=\"C\" onchange=\"checkMCQ('3', '4', 'C')\"> C. Electricity</label><label><input type=\"radio\" name=\"q4\" value=\"D\" onchange=\"checkMCQ('3', '4', 'D')\"> D. All are correct</label></div><div id=\"res-3-4\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 5.</b> According to the passage, which of the following is NOT true about nuclear power?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q5\" value=\"A\" onchange=\"checkMCQ('3', '5', 'A')\"> A. safe</label><label><input type=\"radio\" name=\"q5\" value=\"B\" onchange=\"checkMCQ('3', '5', 'B')\"> B. risky</label><label><input type=\"radio\" name=\"q5\" value=\"C\" onchange=\"checkMCQ('3', '5', 'C')\"> C. dangerous</label><label><input type=\"radio\" name=\"q5\" value=\"D\" onchange=\"checkMCQ('3', '5', 'D')\"> D. unsafe\nQuestion 6: Who knows exactly how much fuel is left?\nA. Many people\nB. Nobody\nC. Professor Marvin Burnham\nD. Everybody\nQuestion 7: Why don’t people agree with using nuclear power?\nA. Because there is a serious nuclear.\nB. Because we have to use coal, oil and gas.\nC. Because it is very dangerous.\nD. Because it is often run out of.</label></div><div id=\"res-3-5\" style=\"margin-top:5px\"></div></div></div></div></div>\n        </div>\n        <div id=\"gap-popover\" class=\"popover\"></div><div class=\"overlay\" onclick=\"closeVocabModal()\"></div>\n        <div class=\"vocab-modal\" id=\"vocab-modal\"><div class=\"vocab-header\" id=\"v-word\"></div><div class=\"vocab-body\"><div style=\"font-weight:bold;margin-bottom:10px\" id=\"v-meaning\"></div><div style=\"font-style:italic;color:#666;margin-bottom:10px\" id=\"v-synonym\"></div><div style=\"background:#f1f5f9;padding:10px;border-left:4px solid #22c55e\" id=\"v-example\"></div></div></div>\n        <div id=\"vocab-game-overlay\">\n    <div id=\"game-container\">\n        <header class=\"game-header\">\n            <h1 class=\"game-h1\">Vocabulary Matching Game</h1>\n            <div class=\"game-controls\"><div class=\"game-badge\" id=\"score\">Đúng: 0 / 0</div><button class=\"game-btn\" id=\"shuffleBtn\">Trộn</button><button class=\"game-btn\" id=\"resetBtn\">Làm lại</button><button class=\"game-btn game-btn-close\" onclick=\"closeVocabGame()\">❌ Close</button></div>\n        </header>\n        <section class=\"game-card\" style=\"margin-bottom:12px;\">\n            <h3 style=\"margin-top:0; color:var(--accent)\">Flashcards Ôn Tập</h3>\n            <div style=\"display:flex; gap:12px; align-items:center; flex-wrap:wrap;\">\n            <div class=\"flash-wrap\"><div id=\"flashcard\" class=\"flashcard\" tabindex=\"0\"><div class=\"flash-face front\" id=\"flashFront\">Start</div><div class=\"flash-face back\" id=\"flashBack\">Back</div></div></div>\n            <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                <div style=\"display:flex; gap:8px;\"><button class=\"game-btn\" id=\"prevCard\">Prev</button><button class=\"game-btn\" id=\"flipCard\">Flip</button><button class=\"game-btn\" id=\"nextCard\">Next</button></div>\n                <div style=\"display:flex; gap:8px;\"><button class=\"game-btn\" id=\"autoPlay\">Auto</button><button class=\"game-btn\" id=\"showBoth\">Show Both</button></div>\n            </div></div>\n        </section>\n        <section class=\"game-layout\">\n            <div class=\"game-card\"><h3 style=\"margin-top:0; color:var(--accent)\">Phần 1 Matching</h3><div class=\"game-list\" id=\"engList\" style=\"margin-top:12px;\"></div></div>\n            <div class=\"game-card\"><h3 style=\"margin-top:0; color:var(--accent)\">Phần 2 Vietnamese</h3><div class=\"game-vie-list\" id=\"vieList\" style=\"margin-top:12px;\"></div></div>\n        </section>\n        <section class=\"game-card\" style=\"margin-top:12px;\">\n            <h3 style=\"margin-top:0; color:var(--accent)\">Bài Điền Chữ</h3>\n            <div style=\"margin-top:10px;\"><div class=\"fill-list\" id=\"fillList\"></div><div style=\"margin-top:10px; display:flex; gap:8px;\"><button class=\"game-btn\" id=\"checkFill\">Kiểm tra</button><button class=\"game-btn\" id=\"showAnswers\">Hiện đáp án</button><button class=\"game-btn\" id=\"resetFill\">Làm lại</button><div class=\"game-small\" id=\"fillScore\" style=\"align-self:center\">Điểm: 0 / 0</div></div></div>\n        </section>\n        <div class=\"game-confetti\" id=\"confetti\"></div>\n    </div>\n</div>\n        <script> \n        const DATA = {\"keys\":{\"1-5\":\"C\",\"1-6\":\"B\",\"1-7\":\"C\",\"1-8\":\"C\",\"1-9\":\"D\",\"1-10\":\"D\",\"1-11\":\"D\",\"1-12\":\"B\",\"1-13\":\"C\",\"1-14\":\"A\",\"1-15\":\"A\",\"3-1\":\"C\",\"3-2\":\"A\",\"3-3\":\"D\",\"3-4\":\"B\",\"3-5\":\"A\",\"3-6\":\"B\",\"3-7\":\"C\"},\"gapOptions\":{\"1-5\":{\"A\":\"were working\",\"B\":\"worked\",\"C\":\"was working\",\"D\":\"works\"},\"1-6\":{\"A\":\"in\",\"B\":\"on\",\"C\":\"at\",\"D\":\"from\"},\"1-7\":{\"A\":\"water\",\"B\":\"noise\",\"C\":\"air\",\"D\":\"soil\"},\"1-8\":{\"A\":\"many\",\"B\":\"a few\",\"C\":\"some\",\"D\":\"any\"},\"1-9\":{\"A\":\"a\",\"B\":\"an\",\"C\":\"the\",\"D\":\"Ө\"},\"1-10\":{\"A\":\"but\",\"B\":\"for\",\"C\":\"or\",\"D\":\"so\"},\"1-11\":{\"A\":\"never\",\"B\":\"rarely\",\"C\":\"seldom\",\"D\":\"always\"},\"1-12\":{\"A\":\"After\",\"B\":\"Before\",\"C\":\"As soon as\",\"D\":\"Until\"},\"1-13\":{\"A\":\"What are they?\",\"B\":\"When do you use?\",\"C\":\"What do you mean?\",\"D\":\"What dose it stand?\"},\"1-14\":{\"A\":\"What\",\"B\":\"How\",\"C\":\"Why\",\"D\":\"When\"},\"1-15\":{\"A\":\"cultures\",\"B\":\"traditions\",\"C\":\"customs\",\"D\":\"habits\"}},\"vocabMap\":{},\"htmlContent\":\"<div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 1: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\"><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>5.</b> While she <span class=\\\"gap-btn\\\" id=\\\"gap-1-5\\\" onclick=\\\"showGapOptions(event, '1', '5')\\\">(...)</span> in the field, the tornado came.\\n</div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>6.</b> Look! These sports shoes are  <span class=\\\"gap-btn\\\" id=\\\"gap-1-6\\\" onclick=\\\"showGapOptions(event, '1', '6')\\\">(...)</span>sale . They are 30% off.\\n</div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>7.</b> Because of  <span class=\\\"gap-btn\\\" id=\\\"gap-1-7\\\" onclick=\\\"showGapOptions(event, '1', '7')\\\">(...)</span> pollution, the bicycle may someday replace the automobile.\\n     </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>8.</b> I’m searching for <span class=\\\"gap-btn\\\" id=\\\"gap-1-8\\\" onclick=\\\"showGapOptions(event, '1', '8')\\\">(...)</span> information about the lifestyle of the Van Kieu in central Viet Nam.\\n   </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>9.</b> I like <span class=\\\"gap-btn\\\" id=\\\"gap-1-9\\\" onclick=\\\"showGapOptions(event, '1', '9')\\\">(...)</span> tea but I don’t like the tea they make at the office.\\n   </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>10.</b> Many girls worry about their appearance, <span class=\\\"gap-btn\\\" id=\\\"gap-1-10\\\" onclick=\\\"showGapOptions(event, '1', '10')\\\">(...)</span> they often look at themselves in a mirror.\\n     </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>11.</b> It is <span class=\\\"gap-btn\\\" id=\\\"gap-1-11\\\" onclick=\\\"showGapOptions(event, '1', '11')\\\">(...)</span> easier to prevent harm to the environment than to repair it.\\n</div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>12.</b> <span class=\\\"gap-btn\\\" id=\\\"gap-1-12\\\" onclick=\\\"showGapOptions(event, '1', '12')\\\">(...)</span> she left the party, Jenny said goodbye to the host.\\n    </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>13.</b> - An: <span class=\\\"gap-btn\\\" id=\\\"gap-1-13\\\" onclick=\\\"showGapOptions(event, '1', '13')\\\">(...)</span>by the 3Rs? \\n                      - Ba: They are Reduce, Reuse, and Recycle\\n </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>14.</b> <span class=\\\"gap-btn\\\" id=\\\"gap-1-14\\\" onclick=\\\"showGapOptions(event, '1', '14')\\\">(...)</span> street food in Viet Nam is most popular among foreign visitors?\\n     </div><div class=\\\"mcq-item\\\" style=\\\"margin-bottom:15px\\\"><b>15.</b> There are different types of street food among regions and <span class=\\\"gap-btn\\\" id=\\\"gap-1-15\\\" onclick=\\\"showGapOptions(event, '1', '15')\\\">(...)</span> around the world.\\n</div></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 2: Reading</h3>\\n                        <button class=\\\"fullscreen-btn\\\" onclick=\\\"toggleFullScreenReading(this)\\\">⛶ Full Screen</button>\\n                    </div>\\n                    <div class=\\\"reading-container\\\" id=\\\"reading-2\\\"><div class=\\\"reading-left\\\">Many people still believe that natural resources will never be used up. Actually, the world's energy resources are limited. Nobody knows exactly how much fuel is left. However, we also should use them economically and try to find out alternative sources of power. According to Professor Marvin Burnham of the New England Institute of Technology, we have to start conserving coal, oil and gas before it is too late; and nuclear power is the only alternative.<br>However, many people do not approve of using nuclear power because it's very dangerous. What would happen if there were a serious nuclear accident?Radioactivity causes cancer and may badly affect the future generations. The most effective thing is that we should use natural resources as economically as possible.<br>(Adapted from sachmoi24h.com)<br></div><div class=\\\"reading-right\\\"><div class=\\\"mcq-question\\\"><b>Question 1.</b> Many people still believe that we will never ......... natural resources.<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q1\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '1', 'A')\\\"> A. rise</label><label><input type=\\\"radio\\\" name=\\\"q1\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '1', 'B')\\\"> B. reduce</label><label><input type=\\\"radio\\\" name=\\\"q1\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '1', 'C')\\\"> C. run out of</label><label><input type=\\\"radio\\\" name=\\\"q1\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '1', 'D')\\\"> D. raise</label></div><div id=\\\"res-3-1\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 2.</b> What's the main idea of the passage?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q2\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '2', 'A')\\\"> A. save energy</label><label><input type=\\\"radio\\\" name=\\\"q2\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '2', 'B')\\\"> B. nuclear accident</label><label><input type=\\\"radio\\\" name=\\\"q2\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '2', 'C')\\\"> C. natural resource</label><label><input type=\\\"radio\\\" name=\\\"q2\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '2', 'D')\\\"> D. the use of coal</label></div><div id=\\\"res-3-2\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 3.</b> The phrase \\\"approve of\\\" in the passage is closest in meaning to<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q3\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '3', 'A')\\\"> A. explain</label><label><input type=\\\"radio\\\" name=\\\"q3\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '3', 'B')\\\"> B. disagree</label><label><input type=\\\"radio\\\" name=\\\"q3\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '3', 'C')\\\"> C. improve</label><label><input type=\\\"radio\\\" name=\\\"q3\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '3', 'D')\\\"> D. agree</label></div><div id=\\\"res-3-3\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 4.</b> What causes cancer and may badly affect the future generations?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q4\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '4', 'A')\\\"> A. Coal</label><label><input type=\\\"radio\\\" name=\\\"q4\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '4', 'B')\\\"> B. Radioactivity</label><label><input type=\\\"radio\\\" name=\\\"q4\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '4', 'C')\\\"> C. Electricity</label><label><input type=\\\"radio\\\" name=\\\"q4\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '4', 'D')\\\"> D. All are correct</label></div><div id=\\\"res-3-4\\\" style=\\\"margin-top:5px\\\"></div></div><div class=\\\"mcq-question\\\"><b>Question 5.</b> According to the passage, which of the following is NOT true about nuclear power?<div class=\\\"mcq-options\\\"><label><input type=\\\"radio\\\" name=\\\"q5\\\" value=\\\"A\\\" onchange=\\\"checkMCQ('3', '5', 'A')\\\"> A. safe</label><label><input type=\\\"radio\\\" name=\\\"q5\\\" value=\\\"B\\\" onchange=\\\"checkMCQ('3', '5', 'B')\\\"> B. risky</label><label><input type=\\\"radio\\\" name=\\\"q5\\\" value=\\\"C\\\" onchange=\\\"checkMCQ('3', '5', 'C')\\\"> C. dangerous</label><label><input type=\\\"radio\\\" name=\\\"q5\\\" value=\\\"D\\\" onchange=\\\"checkMCQ('3', '5', 'D')\\\"> D. unsafe\\nQuestion 6: Who knows exactly how much fuel is left?\\nA. Many people\\nB. Nobody\\nC. Professor Marvin Burnham\\nD. Everybody\\nQuestion 7: Why don’t people agree with using nuclear power?\\nA. Because there is a serious nuclear.\\nB. Because we have to use coal, oil and gas.\\nC. Because it is very dangerous.\\nD. Because it is often run out of.</label></div><div id=\\\"res-3-5\\\" style=\\\"margin-top:5px\\\"></div></div></div></div></div>\"}; const allKeys = DATA.keys; \n\n        // --- CÁC HÀM XỬ LÝ (ĐÃ UPDATE LOGIC KEY BIỆT LẬP) ---\n        function showGapOptions(e, secId, id) { \n            const p = document.getElementById('gap-popover'); \n            const uniqueKey = secId + '-' + id; \n            const o = DATA.gapOptions[uniqueKey]; \n            if(!o) return;\n            let h = \"\"; \n            for(let k in o) h += '<span class=\"popover-option\" onclick=\"selectGap(\\''+secId+'\\', \\''+id+'\\', \\''+k+'\\', \\''+o[k].replace(/'/g, \"\\\\'\")+'\\')\"><b>'+k+'.</b> '+o[k]+'</span>'; \n            p.innerHTML = h; p.style.display = 'block'; p.style.left = e.pageX + 'px'; p.style.top = (e.pageY + 20) + 'px'; \n            setTimeout(() => { document.addEventListener('click', function close(ev) { if (!p.contains(ev.target) && ev.target !== e.target) { p.style.display = 'none'; document.removeEventListener('click', close); } }); }, 0); \n        } \n\n        function selectGap(secId, qId, key, text) { \n            const btn = document.getElementById('gap-'+secId+'-'+qId); \n            if(!btn) return;\n            btn.innerText = text; btn.classList.add('filled'); \n            document.getElementById('gap-popover').style.display = 'none'; \n            \n            // CHECK KEY: Dùng secId-qId để tìm key trong kho\n            const fullKey = secId + '-' + qId;\n            if(allKeys[fullKey]) { \n                btn.style.borderColor = (key === allKeys[fullKey]) ? \"#22c55e\" : \"#ef4444\"; \n                btn.classList.remove('correct', 'wrong'); \n                if(key === allKeys[fullKey]) btn.classList.add('correct'); else btn.classList.add('wrong'); \n            } \n        } \n\n        function checkWordForm() { \n            const inputs = document.querySelectorAll('.word-form-input'); \n            inputs.forEach(inp => { \n                // ID input: wf-secId-qNum\n                const parts = inp.id.split('-');\n                const fullKey = parts[1] + '-' + parts[2];\n                \n                const userVal = inp.value.trim().toLowerCase(); \n                const correctKey = allKeys[fullKey] ? String(allKeys[fullKey]).trim().toLowerCase() : \"\"; \n                inp.classList.remove('correct', 'wrong'); \n                const parent = inp.parentNode; \n                const oldCorr = parent.querySelector('.correction-text'); \n                if(oldCorr) oldCorr.remove(); \n                if (!correctKey) return; \n                if (userVal === correctKey) { inp.classList.add('correct'); } \n                else { inp.classList.add('wrong'); const span = document.createElement('span'); span.className = 'correction-text'; span.innerHTML = '✓ ' + allKeys[fullKey]; if(inp.nextSibling) { parent.insertBefore(span, inp.nextSibling); } else { parent.appendChild(span); } } \n            }); \n        }\n\n        // HÀM CHECK MCQ MỚI (CHO BÀI READING)\n        function checkMCQ(secId, qId, selected) { \n            const resDiv = document.getElementById('res-'+secId+'-'+qId);\n            const fullKey = secId + '-' + qId;\n            resDiv.innerHTML = (allKeys[fullKey] && selected === allKeys[fullKey]) ? '<span style=\"color:#22c55e\">✓ Correct</span>' : '<span style=\"color:#ef4444\">✗ Incorrect</span>'; \n        }\n\n        // (GIỮ NGUYÊN CÁC HÀM KHÁC)\n        let dragSrcEl = null; function addDragEvents() { document.querySelectorAll('.sortable-item').forEach(item => { item.addEventListener('dragstart', function(e) { dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }); item.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); return false; }); item.addEventListener('drop', function(e) { if (e.stopPropagation) e.stopPropagation(); if (dragSrcEl !== this) { const srcHTML = dragSrcEl.innerHTML; const srcId = dragSrcEl.dataset.sid; dragSrcEl.innerHTML = this.innerHTML; dragSrcEl.dataset.sid = this.dataset.sid; this.innerHTML = srcHTML; this.dataset.sid = srcId; } return false; }); }); } window.onload = function() { addDragEvents(); }; \n        function checkOrder(qId, targetStr) { const list = document.getElementById('sortable-'+qId); const current = Array.from(list.getElementsByTagName('li')).map(li => li.dataset.sid); const ans = document.getElementById('ans-'+qId); const fb = document.getElementById('fb-'+qId); if(JSON.stringify(current) === JSON.stringify(targetStr.split(','))) { fb.innerHTML = '<span style=\"color:#22c55e\">✓ Correct!</span>'; ans.style.display = 'none'; } else { fb.innerHTML = '<span style=\"color:#ef4444\">✗ Incorrect</span>'; ans.style.display = 'block'; } } \n        function showVocabDef(key) { const d = DATA.vocabMap[key.toLowerCase()]; if(!d) return; document.getElementById('v-word').innerText = d.original; document.getElementById('v-meaning').innerText = d.meaning; document.getElementById('v-synonym').innerText = d.synonyms ? 'Synonyms: ' + d.synonyms : ''; document.getElementById('v-example').innerText = d.example ? 'Ex: ' + d.example : ''; document.getElementById('vocab-modal').style.display = 'block'; document.querySelector('.overlay').style.display = 'block'; } \n        function closeVocabModal() { document.getElementById('vocab-modal').style.display = 'none'; document.querySelector('.overlay').style.display = 'none'; }\n        function toggleFullScreenReading(btn) { const r = btn.closest('.section-box'); r.classList.toggle('fullscreen-reading'); btn.innerText = r.classList.contains('fullscreen-reading') ? '🗗 Exit Full Screen' : '⛶ Full Screen'; }\n\n        // GAME LOGIC\n        let pairs=[], gameState={engOrder:[],shuffledVie:[],matches:{},score:0};\n        const engListEl=document.getElementById('engList'), vieListEl=document.getElementById('vieList'), scoreEl=document.getElementById('score'), confettiEl=document.getElementById('confetti');\n        function loadPairsFromMap(){ pairs = []; for(let k in DATA.vocabMap){ pairs.push({eng: DATA.vocabMap[k].original, vie: DATA.vocabMap[k].meaning}); } }\n        window.openVocabGame = function() { loadPairsFromMap(); if(pairs.length===0){ alert(\"Không có từ vựng nào!\"); return; } document.getElementById('vocab-game-overlay').style.display='block'; initGame(); }\n        window.closeVocabGame = function() { document.getElementById('vocab-game-overlay').style.display='none'; }\n        function shuffleArray(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }\n        function initGame(){ gameState.matches={}; gameState.score=0; gameState.engOrder=shuffleArray(pairs.map((_,i)=>i)); gameState.shuffledVie=shuffleArray(pairs.map(p=>p.vie)); renderGameEng(); renderGameVie(); attachGameSlotEvents(); updateGameScore(); initFlashcards(); renderFillList(); }\n        function renderGameEng(){ engListEl.innerHTML=''; gameState.engOrder.forEach((o,p)=>{ const x=pairs[o]; const i=document.createElement('div'); i.className='game-eng-item'; i.innerHTML='<div class=\"game-eng-left\"><div class=\"game-index\">'+(p+1)+'</div><div><div style=\"font-weight:700\">'+x.eng+'</div></div></div><div class=\"game-slot\" data-index=\"'+o+'\" tabindex=\"0\"><div class=\"inner\"></div></div>'; engListEl.appendChild(i); }); }\n        function renderGameVie(){ vieListEl.innerHTML=''; gameState.shuffledVie.forEach((t,i)=>{ const d=document.createElement('div'); d.className='game-vie-item'; d.draggable=true; d.dataset.text=t; d.innerHTML='<span style=\"font-weight:600\">'+t+'</span>'; vieListEl.appendChild(d); d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.setData('text/plain',t);window.currentPicked={text:t,el:d}}); d.addEventListener('dragend',()=>d.classList.remove('dragging')); d.addEventListener('click',()=>{if(window.currentPicked&&window.currentPicked.el===d){window.currentPicked=null;d.style.outline=''}else{if(window.currentPicked)window.currentPicked.el.style.outline='';window.currentPicked={text:t,el:d};d.style.outline='2px solid rgba(6,182,212,0.8)'}}); }); }\n        function attachGameSlotEvents(){ document.querySelectorAll('.game-slot').forEach(s=>{ s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('active')}); s.addEventListener('dragleave',()=>s.classList.remove('active')); s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('active');const t=e.dataTransfer.getData('text/plain');handleGameDrop(s,t)}); s.addEventListener('click',()=>{if(window.currentPicked)handleGameDrop(s,window.currentPicked.text)}); }); }\n        function handleGameDrop(s,t){ const i=Number(s.dataset.index); const c=pairs[i].vie; if(gameState.matches[i])return; if(t===c){ s.classList.add('correct'); s.innerHTML='<div class=\"inner\"><span style=\"font-weight:700;color:var(--success)\">'+t+'</span></div>'; gameState.matches[i]=t; gameState.score++; updateGameScore(); celebrate(); speak(pairs[i].eng); const el=Array.from(document.querySelectorAll('.game-vie-item')).find(x=>x.dataset.text===t); if(el)el.remove(); window.currentPicked=null; }else{ s.classList.add('game-wrong'); setTimeout(()=>s.classList.remove('game-wrong'),400); } }\n        function updateGameScore(){ scoreEl.innerHTML='Đúng: <strong>'+gameState.score+'</strong> / '+pairs.length; }\n        function celebrate(){ const c=['#06b6d4','#f97316','#f43f5e','#10b981']; for(let i=0;i<15;i++){ const p=document.createElement('div'); p.className='piece'; p.style.left=Math.random()*100+'%'; p.style.background=c[Math.floor(Math.random()*c.length)]; confettiEl.appendChild(p); setTimeout(()=>p.remove(),1500); } }\n        function speak(t){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.speak(u); } }\n        let flashIndex=0;\n        function initFlashcards(){ flashIndex=0; renderFlash(); }\n        function renderFlash(){ if(!pairs.length)return; const p=pairs[flashIndex]; document.getElementById('flashFront').textContent=p.eng; document.getElementById('flashBack').textContent=p.vie; document.getElementById('flashcard').classList.remove('flipped'); }\n        document.getElementById('nextCard').addEventListener('click',()=>{flashIndex=(flashIndex+1)%pairs.length;renderFlash()}); document.getElementById('prevCard').addEventListener('click',()=>{flashIndex=(flashIndex-1+pairs.length)%pairs.length;renderFlash()}); document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flashcard').classList.toggle('flipped'));\n        const fillListEl=document.getElementById('fillList'), fillScoreEl=document.getElementById('fillScore');\n        function renderFillList(){ fillListEl.innerHTML=''; pairs.forEach((p,i)=>{ const r=document.createElement('div'); r.className='fill-row'; r.innerHTML='<div class=\"vie\">'+p.vie+'</div><input type=\"text\" data-index=\"'+i+'\" placeholder=\"...\" /><div class=\"game-small\" style=\"min-width:60px\" id=\"hint-'+i+'\"></div>'; fillListEl.appendChild(r); }); fillScoreEl.textContent='Điểm: 0 / '+pairs.length; }\n        document.getElementById('checkFill').addEventListener('click',()=>{ let c=0; pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); if(inp.value.trim().toLowerCase()===p.eng.toLowerCase()){c++;inp.classList.add('correct');}else{inp.classList.add('wrong');} }); fillScoreEl.textContent='Điểm: '+c+' / '+pairs.length; });\n        document.getElementById('showAnswers').addEventListener('click',()=>{ pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); inp.value=p.eng; inp.classList.add('correct'); }); });\n        document.getElementById('resetFill').addEventListener('click', renderFillList);\n        document.getElementById('shuffleBtn').addEventListener('click',()=>{gameState.matches={};gameState.score=0;gameState.engOrder=shuffleArray(gameState.engOrder);gameState.shuffledVie=shuffleArray(gameState.shuffledVie);renderGameEng();renderGameVie();attachGameSlotEvents();updateGameScore()});\n        document.getElementById('resetBtn').addEventListener('click',initGame);\n        <\/script>\n\t\t<script type=\"text/javascript\">var lbplugin_event_opt={\"extension_enable\":true,\"dict_type\":1,\"dbclk_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1},\"select_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1}};function loadScript(t,e){var n=document.createElement(\"script\");n.type=\"text/javascript\",n.readyState?n.onreadystatechange=function(){(\"loaded\"===n.readyState||\"complete\"===n.readyState)&&(n.onreadystatechange=null,e())}:n.onload=function(){e()},n.src=t,document.getElementsByTagName(\"head\")[0].appendChild(n)}setTimeout(function(){null==document.getElementById(\"lbdictex_find_popup\")&&loadScript(\"https://stc-laban.zdn.vn/dictionary/js/plugin/lbdictplugin.min.js?\"+Date.now()%1e4,function(){lbDictPlugin.init(lbplugin_event_opt)})},1e3);<\/script>\n\t\t</body></html>"},{"name":"GIỮA KỲ II (1).html","filename":"GIỮA KỲ II (1).html","content":"<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>English Practice</title><style>\n        :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626; --bg: #f8fafc; --highlight: #fef08a; } body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.8; } #main { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } .section-box { margin-bottom: 50px; } .section-title { font-size: 1.4em; font-weight: bold; color: var(--primary); margin: 0 0 15px 0; } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; } .gap-fill-text { font-size: 1.15em; text-align: justify; line-height: 1.8; } \n        .gap-btn { display: inline; background: transparent; border: none; border-bottom: 1px dotted #94a3b8; color: var(--primary); font-weight: 600; cursor: pointer; padding: 0 2px; margin: 0 2px; font-size: inherit; font-family: inherit; transition: all 0.2s; } .gap-btn:hover { color: #1d4ed8; border-bottom-style: solid; } .gap-btn.filled { border-bottom: none; font-weight: bold; } .gap-btn.correct { color: var(--success) !important; } .gap-btn.wrong { color: var(--error) !important; text-decoration: line-through; }\n        .reading-container { display: flex; height: 650px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background:#fff; } .reading-left { flex: 1; padding: 25px; overflow-y: auto; background: #fff; border-right: 4px solid #f1f5f9; resize: horizontal; overflow-x: hidden; max-width: 70%; min-width: 30%; } .reading-right { flex: 1; padding: 25px; overflow-y: auto; background: #f8fafc; } .reading-left::-webkit-scrollbar, .reading-right::-webkit-scrollbar { width: 8px; } .reading-left::-webkit-scrollbar-track, .reading-right::-webkit-scrollbar-track { background: #f1f1f1; } .reading-left::-webkit-scrollbar-thumb, .reading-right::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } \n        .vocab-highlight { background-color: transparent; border-bottom: 2px dashed #f59e0b; cursor: help; padding: 0 1px; color: inherit; font-weight: 500; transition: all 0.2s; } .vocab-highlight:hover { background-color: #fffbeb; color: #d97706; }\n        .mcq-question { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; } .sortable-list { list-style: none; padding: 0; } .sortable-item { background: #fff; border: 1px solid #cbd5e1; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 15px; } .popover { position: absolute; background: white; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 10px; z-index: 1000; display: none; min-width: 250px; max-width: 400px; } .popover-option { display: block; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; } .popover-option:hover { background-color: #f8fafc; color: var(--primary); } .vocab-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 400px; border-radius: 16px; z-index: 10000; display: none; border: 1px solid #e2e8f0; overflow:hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); } .vocab-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; } .vocab-body { padding: 20px; } .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999; display: none; } button.action-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); } \n        .mcq-options label { display: block; margin: 8px 0; cursor: pointer; padding:8px; border-radius:4px; transition:background 0.2s } .mcq-options label:hover { background-color: #f1f5f9; }\n        .fullscreen-reading { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; } .fullscreen-reading .reading-container { flex: 1; height: auto !important; } .fullscreen-btn { float: right; padding: 5px 10px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; margin-bottom:5px; } .fullscreen-btn:hover { background: #334155; }\n        .btn-game { background: linear-gradient(90deg, #8b5cf6, #d946ef); color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-bottom:20px; }\n        .word-form-input { border: none; border-bottom: 2px solid #94a3b8; background: transparent; padding: 2px 5px; font-size: 1em; color: var(--primary); font-weight: bold; width: 150px; outline: none; transition: 0.3s; text-align: center; } .word-form-input:focus { border-bottom-color: var(--primary); background: #eff6ff; } .word-form-input.correct { border-bottom-color: var(--success); color: var(--success); background: #dcfce7; } .word-form-input.wrong { border-bottom-color: var(--error); color: var(--error); background: #fee2e2; text-decoration: line-through; } .correction-text { display: inline-block; margin-left: 8px; color: var(--success); font-weight: bold; font-size: 0.9em; background: #f0fdf4; padding: 2px 6px; border-radius: 4px; border: 1px solid #bbf7d0; }\n        @media (max-width: 768px) { .reading-container { flex-direction: column; height: auto; } .reading-left { resize: none; max-width: 100%; border-right: none; border-bottom: 4px solid #f1f5f9; max-height: 300px; } .vocab-modal { width: 90%; } }\n        \n        #vocab-game-overlay { position: fixed; inset: 0; z-index: 5000; background: #0f1724; display: none; overflow-y: auto; color: #e6eef6; }\n        #game-container { width:100%; max-width:1200px; margin: 0 auto; padding: 24px; }\n        .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }\n        .game-h1 { font-size:20px; margin:0; color:#06b6d4; }\n        .game-controls { display:flex; gap:8px; align-items:center; }\n        .game-btn { background:linear-gradient(90deg,#0ea5a4,#06b6d4); border:0; color:#042027; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; }\n        .game-btn-close { background: #ef4444; color: white; }\n        .game-layout { display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }\n        .game-card { flex: 0 0 48%; min-width:320px; box-sizing:border-box; padding:12px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.03); max-height: calc(100vh - 180px); overflow:auto; }\n        .game-list { display:flex; flex-direction:column; gap:10px; }\n        .game-eng-item, .game-vie-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); color: #e6eef6; }\n        .game-eng-left { display:flex; align-items:center; gap:12px; flex: 0 0 220px; min-width:160px; }\n        .game-index { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; color:#94a3b8; font-weight:700; }\n        .game-slot { flex:1; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,0.01); border:2px dashed rgba(255,255,255,0.03); min-height:56px; transition:all 220ms ease; cursor:pointer; position:relative; overflow:visible; }\n        .game-slot .inner { position:relative; z-index:3; }\n        .game-slot.correct { padding-left:12px; font-size:15px; display:flex; align-items:center; border-style:solid; border-width:2px; background:linear-gradient(180deg, rgba(16,185,129,0.03), rgba(16,185,129,0.01)); }\n        .game-slot.correct::before { background: linear-gradient(90deg, rgba(16,185,129,0.9), rgba(96,165,250,0.06)); opacity:0.6; filter:blur(10px); }\n        .game-vie-list { display:flex; flex-wrap:wrap; gap:10px; padding-top:6px; }\n        .game-vie-item { cursor:grab; user-select:none; padding:8px 12px; border-radius:10px; background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); }\n        .game-vie-item.dragging { opacity:0.5; transform:scale(0.98); }\n        .game-wrong { animation:shake 300ms; border-color:rgba(239,68,68,0.6); }\n        .game-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.02); color:#94a3b8; font-weight:600; }\n        .game-confetti { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:6000; }\n        .game-confetti .piece { position:absolute; width:10px; height:14px; opacity:0; animation:fall 1200ms linear forwards; }\n        .game-small { font-size:13px; color:#94a3b8; }\n        .flash-wrap { perspective:1200px; width:100%; max-width:520px; }\n        .flashcard { width:100%; height:140px; position:relative; transform-style:preserve-3d; transition:transform 600ms cubic-bezier(.2,.9,.3,1); border-radius:12px; cursor:pointer; }\n        .flashcard.flipped { transform:rotateY(180deg); }\n        .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:18px; font-size:18px; text-align:center; box-shadow: 0 6px 18px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03); }\n        .flash-face.front { background:linear-gradient(180deg, rgba(6,182,212,0.08), rgba(96,165,250,0.03)); color:#e6f9fb; }\n        .flash-face.back { transform:rotateY(180deg); background:linear-gradient(180deg, rgba(16,185,129,0.06), rgba(96,165,250,0.02)); color:#eafff0; }\n        .fill-list { display:flex; flex-direction:column; gap:10px; }\n        .fill-row { display:flex; gap:12px; align-items:center; }\n        .fill-row .vie { flex:0 0 48%; min-width:160px; color:#94a3b8; }\n        .fill-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(255,255,255,0.02); color:rgba(230,238,246,0.85); transition:all 180ms; }\n        .fill-row input.correct { border-color: rgba(16,185,129,0.7); background: rgba(16,185,129,0.02); }\n        .fill-row input.wrong { border-color: rgba(244,63,94,0.7); background: rgba(244,63,94,0.01); }\n        @keyframes shake{ 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} 100%{transform:translateX(0)} }\n        @keyframes fall{ 0%{opacity:1; transform:translateY(-10vh) rotate(0deg)} 100%{opacity:1; transform:translateY(110vh) rotate(720deg)} }\n        @media (max-width:880px){ .game-layout{grid-template-columns:1fr; flex-direction: column;} .game-card{flex-basis:100%; width:100%;} }\n        \n        </style></head>\n        <body>\n        <div id=\"main\">\n            <button class=\"btn-game\" onclick=\"openVocabGame()\">🎮 Play Vocab Game</button>\n            <h1>English Practice Test</h1>\n            <div class=\"section-box\"><h3 class=\"section-title\">Part 1: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\"><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>5.</b> Students should learn some practical ways that help to <span class=\"gap-btn\" id=\"gap-1-5\" onclick=\"showGapOptions(event, '1', '5')\">(...)</span> pollution.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>6.</b> Don’t forget to turn  <span class=\"gap-btn\" id=\"gap-1-6\" onclick=\"showGapOptions(event, '1', '6')\">(...)</span> the lights before you go out.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>7.</b> A strong earthquake caused a lot of <span class=\"gap-btn\" id=\"gap-1-7\" onclick=\"showGapOptions(event, '1', '7')\">(...)</span> to eastern Japan last week. \n    </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>8.</b> If the temperature<span class=\"gap-btn\" id=\"gap-1-8\" onclick=\"showGapOptions(event, '1', '8')\">(...)</span> rising, the polar ice caps will melt.\n   </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>9.</b> She <span class=\"gap-btn\" id=\"gap-1-9\" onclick=\"showGapOptions(event, '1', '9')\">(...)</span> TV when the alarm went off.\n   </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>11.</b> If you want to stay slim and healthy, you <span class=\"gap-btn\" id=\"gap-1-11\" onclick=\"showGapOptions(event, '1', '11')\">(...)</span>reduce the amount of fast food you eat every day.\n</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>12.</b> I’m never late for our Vietnamese class. I’m <span class=\"gap-btn\" id=\"gap-1-12\" onclick=\"showGapOptions(event, '1', '12')\">(...)</span> on time.</div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>13.</b> A: “The earthquake yesterday destroyed their home.”\n                        B: “<span class=\"gap-btn\" id=\"gap-1-13\" onclick=\"showGapOptions(event, '1', '13')\">(...)</span>”\n    </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>14.</b> We cleaned up everything at the campsite <span class=\"gap-btn\" id=\"gap-1-14\" onclick=\"showGapOptions(event, '1', '14')\">(...)</span> we left.          \n    </div><div class=\"mcq-item\" style=\"margin-bottom:15px\"><b>15.</b> Because of<span class=\"gap-btn\" id=\"gap-1-15\" onclick=\"showGapOptions(event, '1', '15')\">(...)</span> pollution, the bicycle may someday replace the automobile.\n   </div></div></div><div class=\"section-box\"><h3 class=\"section-title\">Part 2: Gap Fill / Cloze Test</h3><div class=\"gap-fill-text\">A corner shop or a convenience shop is a British tradition. It is a small retail shop. We can find a corner shop at the end of a local street in many neighborhoods  <span class=\"gap-btn\" id=\"gap-2-19\" onclick=\"showGapOptions(event, '2', '19')\">(19)</span>  towns and cities across the UK. The corner shop sells all kinds of household goods and simple food and drinks like snacks, groceries, coffee, soft drinks. It  <span class=\"gap-btn\" id=\"gap-2-20\" onclick=\"showGapOptions(event, '2', '20')\">(20)</span>  sells newspapers, magazines, and cigarettes.<br>Convenience stores are originally from America. They are like the British corner shops. The only  <span class=\"gap-btn\" id=\"gap-2-21\" onclick=\"showGapOptions(event, '2', '21')\">(21)</span>  is that convenience stores are often open 24 hours. Probably the  <span class=\"gap-btn\" id=\"gap-2-22\" onclick=\"showGapOptions(event, '2', '22')\">(22)</span>  well-known convenience store is 7-Eleven. You can find a convenience store at any residential area, a filling station, a railway station, or alongside a busy road.<br>Today, there are convenience stores all over the world. Each country has its own  <span class=\"gap-btn\" id=\"gap-2-23\" onclick=\"showGapOptions(event, '2', '23')\">(23)</span>  of convenience stores as well as the global brand 7-Eleven. Both corner shops and convenience stores  <span class=\"gap-btn\" id=\"gap-2-24\" onclick=\"showGapOptions(event, '2', '24')\">(24)</span>  things at higher prices than the supermarket, but they are much more convenient.<br></div></div><div class=\"section-box\">\n                    <div class=\"section-header\">\n                        <h3 class=\"section-title\">Part 3: Reading</h3>\n                        <button class=\"fullscreen-btn\" onclick=\"toggleFullScreenReading(this)\">⛶ Full Screen</button>\n                    </div>\n                    <div class=\"reading-container\" id=\"reading-3\"><div class=\"reading-left\">The Sai Gon Zoo and Botanical Garden contains 590 animals of 125 species and 1830 trees and plants of 260 species, some of which are over 100 years old. This includes 20 species of orchid, 32 species of cactus and 34 species of bonsai. The Sai Gon Zoo and Botanical Garden is divided into an animal conservation area, a plant conservation area, an orchid garden and an amusement park.<br><br>  The botanical garden contains many species of rare and valuable plants, some of which are not native to Viet Nam. There are species of cacti, ferns and plants that have been imported from Africa and America. The zoo has many kinds of mammals, reptiles, and birds such as monkeys, giraffes, white Bengal tigers, clouded leopards, African lions, gibbons, turtles and snakes. Besides native animal species, there are also many exotic species, some of which are seen in Viet Nam for the first time, such as Hippopotamus amphibius, Choeropsis liberiensis, Panthera onca, Struthio camelus, Phoenicopterus ruber.<br><br></div><div class=\"reading-right\"><div class=\"mcq-question\"><b>Question 25.</b> Which of these is NOT true about the animals and plants in the Sai Gon Zoo and Botanical Garden, according to the text?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q25\" value=\"A\" onchange=\"checkMCQ('3', '25', 'A')\"> A. They are very diverse.</label><label><input type=\"radio\" name=\"q25\" value=\"B\" onchange=\"checkMCQ('3', '25', 'B')\"> B. Not all of them are native to Viet Nam.</label><label><input type=\"radio\" name=\"q25\" value=\"C\" onchange=\"checkMCQ('3', '25', 'C')\"> C. There are more plant species.</label><label><input type=\"radio\" name=\"q25\" value=\"D\" onchange=\"checkMCQ('3', '25', 'D')\"> D. They are all 100 years old.</label></div><div id=\"res-3-25\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 26.</b> How many areas is The Sai Gon Zoo and Botanical Garden divided into?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q26\" value=\"A\" onchange=\"checkMCQ('3', '26', 'A')\"> A. 2</label><label><input type=\"radio\" name=\"q26\" value=\"B\" onchange=\"checkMCQ('3', '26', 'B')\"> B. 3</label><label><input type=\"radio\" name=\"q26\" value=\"C\" onchange=\"checkMCQ('3', '26', 'C')\"> C. 4</label><label><input type=\"radio\" name=\"q26\" value=\"D\" onchange=\"checkMCQ('3', '26', 'D')\"> D. 1</label></div><div id=\"res-3-26\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 27.</b> Which of following A,B,C or D is closest in meaning to the word “rare”?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q27\" value=\"A\" onchange=\"checkMCQ('3', '27', 'A')\"> A. uncommon</label><label><input type=\"radio\" name=\"q27\" value=\"B\" onchange=\"checkMCQ('3', '27', 'B')\"> B. diversified</label><label><input type=\"radio\" name=\"q27\" value=\"C\" onchange=\"checkMCQ('3', '27', 'C')\"> C. typical</label><label><input type=\"radio\" name=\"q27\" value=\"D\" onchange=\"checkMCQ('3', '27', 'D')\"> D. normal</label></div><div id=\"res-3-27\" style=\"margin-top:5px\"></div></div><div class=\"mcq-question\"><b>Question 28.</b> What animal is seen in Viet Nam for the first time?<div class=\"mcq-options\"><label><input type=\"radio\" name=\"q28\" value=\"A\" onchange=\"checkMCQ('3', '28', 'A')\"> A. White Bengal Tigers</label><label><input type=\"radio\" name=\"q28\" value=\"B\" onchange=\"checkMCQ('3', '28', 'B')\"> B. Hippopotamus amphibius</label><label><input type=\"radio\" name=\"q28\" value=\"C\" onchange=\" meday replace the automobile.\\n   </div></div></div><div class=\\\"section-box\\\"><h3 class=\\\"section-title\\\">Part 2: Gap Fill / Cloze Test</h3><div class=\\\"gap-fill-text\\\">A corner shop or a convenience shop is a British tradition. It is a small retail shop. We can find a corner shop at the end of a local street in many neighborhoods  <span class=\\\"gap-btn\\\" id=\\\"gap-2-19\\\" onclick=\\\"showGapOptions(event, '2', '19')\\\">(19)</span>  towns and cities across the UK. The corner shop sells all kinds of household goods and simple food and drinks like snacks, groceries, coffee, soft drinks. It  <span class=\\\"gap-btn\\\" id=\\\"gap-2-20\\\" onclick=\\\"showGapOptions(event, '2', '20')\\\">(20)</span>  sells newspapers, magazines, and cigarettes.<br>Convenience stores are originally from America. They are like the British corner shops. The only  <span class=\\\"gap-btn\\\" id=\\\"gap-2-21\\\" onclick=\\\"showGapOptions(event, '2', '21')\\\">(21)</span>  is that convenience stores are often open 24 hours. Probably the  <span class=\\\"gap-btn\\\" id=\\\"gap-2-22\\\" onclick=\\\"showGapOptions(event, '2', '22')\\\">(22)</span>  well-known convenience store is 7-Eleven. You can find a convenience store at any residential area, a filling station, a railway station, or alongside a busy road.<br>Today, there are convenience stores all over the world. Each country has its own  <span class=\\\"gap-btn\\\" id=\\\"gap-2-23\\\" onclick=\\\"showGapOptions(event, '2', '23')\\\">(23)</span>  of convenience stores as well as the global brand 7-Eleven. Both corner shops and convenience stores  <span class=\\\"gap-btn\\\" id=\\\"gap-2-24\\\" onclick=\\\"showGapOptions(event, '2', '24')\\\">(24)</span>  things at higher prices than the supermarket, but they are much more convenient.<br></div></div><div class=\\\"section-box\\\">\\n                    <div class=\\\"section-header\\\">\\n                        <h3 class=\\\"section-title\\\">Part 3: Reading</h3>\\n eys[fullKey] ? String(allKeys[fullKey]).trim().toLowerCase() : \"\"; \n                inp.classList.remove('correct', 'wrong'); \n                const parent = inp.parentNode; \n                const oldCorr = parent.querySelector('.correction-text'); \n                if(oldCorr) oldCorr.remove(); \n                if (!correctKey) return; \n                if (userVal === correctKey) { inp.classList.add('correct'); } \n                else { inp.classList.add('wrong'); const span = document.createElement('span'); span.className = 'correction-text'; span.innerHTML = '✓ ' + allKeys[fullKey]; if(inp.nextSibling) { parent.insertBefore(span, inp.nextSibling); } else { parent.appendChild(span); } } \n            }); \n        }\n\n        // HÀM CHECK MCQ MỚI (CHO BÀI READING)\n        function checkMCQ(secId, qId, selected) { \n            const resDiv = document.getElementById('res-'+secId+'-'+qId);\n            const fullKey = secId + '-' + qId;\n            resDiv.innerHTML = (allKeys[fullKey] && selected === allKeys[fullKey]) ? '<span style=\"color:#22c55e\">✓ Correct</span>' : '<span style=\"color:#ef4444\">✗ Incorrect</span>'; \n        }\n\n        // (GIỮ NGUYÊN CÁC HÀM KHÁC)\n        let dragSrcEl = null; function addDragEvents() { document.querySelectorAll('.sortable-item').forEach(item => { item.addEventListener('dragstart', function(e) { dragSrcEl = this; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }); item.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); return false; }); item.addEventListener('drop', function(e) { if (e.stopPropagation) e.stopPropagation(); if (dragSrcEl !== this) { const srcHTML = dragSrcEl.innerHTML; const srcId = dragSrcEl.dataset.sid; dragSrcEl.innerHTML = this.innerHTML; dragSrcEl.dataset.sid = this.dataset.sid; this.innerHTML = srcHTML; this.dataset.sid = srcId; } return false; }); }); } window.onload = function() { addDragEvents(); }; \n        function checkOrder(qId, targetStr) { const list = document.getElementById('sortable-'+qId); const current = Array.from(list.getElementsByTagName('li')).map(li => li.dataset.sid); const ans = document.getElementById('ans-'+qId); const fb = document.getElementById('fb-'+qId); if(JSON.stringify(current) === JSON.stringify(targetStr.split(','))) { fb.innerHTML = '<span style=\"color:#22c55e\">✓ Correct!</span>'; ans.style.display = 'none'; } else { fb.innerHTML = '<span style=\"color:#ef4444\">✗ Incorrect</span>'; ans.style.display = 'block'; } } \n        function showVocabDef(key) { const d = DATA.vocabMap[key.toLowerCase()]; if(!d) return; document.getElementById('v-word').innerText = d.original; document.getElementById('v-meaning').innerText = d.meaning; document.getElementById('v-synonym').innerText = d.synonyms ? 'Synonyms: ' + d.synonyms : ''; document.getElementById('v-example').innerText = d.example ? 'Ex: ' + d.example : ''; document.getElementById('vocab-modal').style.display = 'block'; document.querySelector('.overlay').style.display = 'block'; } \n        function closeVocabModal() { document.getElementById('vocab-modal').style.display = 'none'; document.querySelector('.overlay').style.display = 'none'; }\n        function toggleFullScreenReading(btn) { const r = btn.closest('.section-box'); r.classList.toggle('fullscreen-reading'); btn.innerText = r.classList.contains('fullscreen-reading') ? '🗗 Exit Full Screen' : '⛶ Full Screen'; }\n\n        // GAME LOGIC\n        let pairs=[], gameState={engOrder:[],shuffledVie:[],matches:{},score:0};\n        const engListEl=document.getElementById('engList'), vieListEl=document.getElementById('vieList'), scoreEl=document.getElementById('score'), confettiEl=document.getElementById('confetti');\n        function loadPairsFromMap(){ pairs = []; for(let k in DATA.vocabMap){ pairs.push({eng: DATA.vocabMap[k].original, vie: DATA.vocabMap[k].meaning}); } }\n        window.openVocabGame = function() { loadPairsFromMap(); if(pairs.length===0){ alert(\"Không có từ vựng nào!\"); return; } document.getElementById('vocab-game-overlay').style.display='block'; initGame(); }\n        window.closeVocabGame = function() { document.getElementById('vocab-game-overlay').style.display='none'; }\n        function shuffleArray(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }\n        function initGame(){ gameState.matches={}; gameState.score=0; gameState.engOrder=shuffleArray(pairs.map((_,i)=>i)); gameState.shuffledVie=shuffleArray(pairs.map(p=>p.vie)); renderGameEng(); renderGameVie(); attachGameSlotEvents(); updateGameScore(); initFlashcards(); renderFillList(); }\n        function renderGameEng(){ engListEl.innerHTML=''; gameState.engOrder.forEach((o,p)=>{ const x=pairs[o]; const i=document.createElement('div'); i.className='game-eng-item'; i.innerHTML='<div class=\"game-eng-left\"><div class=\"game-index\">'+(p+1)+'</div><div><div style=\"font-weight:700\">'+x.eng+'</div></div></div><div class=\"game-slot\" data-index=\"'+o+'\" tabindex=\"0\"><div class=\"inner\"></div></div>'; engListEl.appendChild(i); }); }\n        function renderGameVie(){ vieListEl.innerHTML=''; gameState.shuffledVie.forEach((t,i)=>{ const d=document.createElement('div'); d.className='game-vie-item'; d.draggable=true; d.dataset.text=t; d.innerHTML='<span style=\"font-weight:600\">'+t+'</span>'; vieListEl.appendChild(d); d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.setData('text/plain',t);window.currentPicked={text:t,el:d}}); d.addEventListener('dragend',()=>d.classList.remove('dragging')); d.addEventListener('click',()=>{if(window.currentPicked&&window.currentPicked.el===d){window.currentPicked=null;d.style.outline=''}else{if(window.currentPicked)window.currentPicked.el.style.outline='';window.currentPicked={text:t,el:d};d.style.outline='2px solid rgba(6,182,212,0.8)'}}); }); }\n        function attachGameSlotEvents(){ document.querySelectorAll('.game-slot').forEach(s=>{ s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('active')}); s.addEventListener('dragleave',()=>s.classList.remove('active')); s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('active');const t=e.dataTransfer.getData('text/plain');handleGameDrop(s,t)}); s.addEventListener('click',()=>{if(window.currentPicked)handleGameDrop(s,window.currentPicked.text)}); }); }\n        function handleGameDrop(s,t){ const i=Number(s.dataset.index); const c=pairs[i].vie; if(gameState.matches[i])return; if(t===c){ s.classList.add('correct'); s.innerHTML='<div class=\"inner\"><span style=\"font-weight:700;color:var(--success)\">'+t+'</span></div>'; gameState.matches[i]=t; gameState.score++; updateGameScore(); celebrate(); speak(pairs[i].eng); const el=Array.from(document.querySelectorAll('.game-vie-item')).find(x=>x.dataset.text===t); if(el)el.remove(); window.currentPicked=null; }else{ s.classList.add('game-wrong'); setTimeout(()=>s.classList.remove('game-wrong'),400); } }\n        function updateGameScore(){ scoreEl.innerHTML='Đúng: <strong>'+gameState.score+'</strong> / '+pairs.length; }\n        function celebrate(){ const c=['#06b6d4','#f97316','#f43f5e','#10b981']; for(let i=0;i<15;i++){ const p=document.createElement('div'); p.className='piece'; p.style.left=Math.random()*100+'%'; p.style.background=c[Math.floor(Math.random()*c.length)]; confettiEl.appendChild(p); setTimeout(()=>p.remove(),1500); } }\n        function speak(t){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.speak(u); } }\n        let flashIndex=0;\n        function initFlashcards(){ flashIndex=0; renderFlash(); }\n        function renderFlash(){ if(!pairs.length)return; const p=pairs[flashIndex]; document.getElementById('flashFront').textContent=p.eng; document.getElementById('flashBack').textContent=p.vie; document.getElementById('flashcard').classList.remove('flipped'); }\n        document.getElementById('nextCard').addEventListener('click',()=>{flashIndex=(flashIndex+1)%pairs.length;renderFlash()}); document.getElementById('prevCard').addEventListener('click',()=>{flashIndex=(flashIndex-1+pairs.length)%pairs.length;renderFlash()}); document.getElementById('flipCard').addEventListener('click',()=>document.getElementById('flashcard').classList.toggle('flipped'));\n        const fillListEl=document.getElementById('fillList'), fillScoreEl=document.getElementById('fillScore');\n        function renderFillList(){ fillListEl.innerHTML=''; pairs.forEach((p,i)=>{ const r=document.createElement('div'); r.className='fill-row'; r.innerHTML='<div class=\"vie\">'+p.vie+'</div><input type=\"text\" data-index=\"'+i+'\" placeholder=\"...\" /><div class=\"game-small\" style=\"min-width:60px\" id=\"hint-'+i+'\"></div>'; fillListEl.appendChild(r); }); fillScoreEl.textContent='Điểm: 0 / '+pairs.length; }\n        document.getElementById('checkFill').addEventListener('click',()=>{ let c=0; pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); if(inp.value.trim().toLowerCase()===p.eng.toLowerCase()){c++;inp.classList.add('correct');}else{inp.classList.add('wrong');} }); fillScoreEl.textContent='Điểm: '+c+' / '+pairs.length; });\n        document.getElementById('showAnswers').addEventListener('click',()=>{ pairs.forEach((p,i)=>{ const inp=fillListEl.querySelector('input[data-index=\"'+i+'\"]'); inp.value=p.eng; inp.classList.add('correct'); }); });\n        document.getElementById('resetFill').addEventListener('click', renderFillList);\n        document.getElementById('shuffleBtn').addEventListener('click',()=>{gameState.matches={};gameState.score=0;gameState.engOrder=shuffleArray(gameState.engOrder);gameState.shuffledVie=shuffleArray(gameState.shuffledVie);renderGameEng();renderGameVie();attachGameSlotEvents();updateGameScore()});\n        document.getElementById('resetBtn').addEventListener('click',initGame);\n\t\t\n\t\t\n        <\/script>\n\t\t\n\t\t<script type=\"text/javascript\">var lbplugin_event_opt={\"extension_enable\":true,\"dict_type\":1,\"dbclk_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1},\"select_event\":{\"trigger\":\"none\",\"enable\":true,\"display\":1}};function loadScript(t,e){var n=document.createElement(\"script\");n.type=\"text/javascript\",n.readyState?n.onreadystatechange=function(){(\"loaded\"===n.readyState||\"complete\"===n.readyState)&&(n.onreadystatechange=null,e())}:n.onload=function(){e()},n.src=t,document.getElementsByTagName(\"head\")[0].appendChild(n)}setTimeout(function(){null==document.getElementById(\"lbdictex_find_popup\")&&loadScript(\"https://stc-laban.zdn.vn/dictionary/js/plugin/lbdictplugin.min.js?\"+Date.now()%1e4,function(){lbDictPlugin.init(lbplugin_event_opt)})},1e3);<\/script>\n\t\t\n\t\t</body></html>"}];
    const select = document.getElementById('selectBai');
    const openBtn = document.getElementById('openBtn');
    const clearBtn = document.getElementById('clearBtn');
    const frame = document.getElementById('frame');
    const controlsBar = document.getElementById('controlsBar');

    // populate select
    items.forEach((it, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = it.name || it.filename || ('Bài ' + (idx+1));
      select.appendChild(opt);
    });

    function enterFullscreenMode() {
      // hide controls and expand iframe
      controlsBar.classList.add('hidden');
      frame.classList.add('fullscreen-frame');

      // create close button if chưa có
      if (!document.getElementById('closeFullscreen')) {
        const btn = document.createElement('button');
        btn.id = 'closeFullscreen';
        btn.textContent = 'Đóng toàn màn hình';
        btn.onclick = exitFullscreenMode;
        document.body.appendChild(btn);
      }
    }

    function exitFullscreenMode() {
      // restore controls and iframe
      controlsBar.classList.remove('hidden');
      frame.classList.remove('fullscreen-frame');
      const btn = document.getElementById('closeFullscreen');
      if (btn) btn.remove();
    }

    openBtn.onclick = () => {
      const v = select.value;
      if (v === '') {
        alert('Vui lòng chọn một bài.');
        return;
      }
      const it = items[+v];
      frame.srcdoc = it.content;

      // vào chế độ toàn màn hình
      enterFullscreenMode();
    };

    clearBtn.onclick = () => {
      select.value = '';
      frame.srcdoc = '<p>Chưa chọn bài</p>';
    };

    // allow Enter key to open when select focused
    select.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') openBtn.click();
    });

    // Escape để thoát toàn màn hình
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        exitFullscreenMode();
      }
    });
